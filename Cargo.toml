[workspace]
resolver = "3"
members = ["crates/broker-core", "crates/broker-server", "crates/otter-credential-broker"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
broker-core = { path = "crates/broker-core" }
broker-server = { path = "crates/broker-server" }

anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "query", "tracing", "matched-path"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
clap = { version = "4.6.8", features = ["derive", "env"] }
figment = { version = "0.10.19", features = ["env", "toml"] }
getrandom = "0.4.3"
hex = "0.4.3"
hmac = "0.13.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server", "service", "http1"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
bytes = "1.12.1"
metrics = "0.24.6"
opentelemetry = "0.33.1"
opentelemetry_sdk = { version = "0.33.1", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"] }
tracing-opentelemetry = "0.34.0"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
# Tests only: a TLS server standing in for an upstream provider.
rustls = { version = "=0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "tls-rustls-aws-lc-rs-native-roots"] }
subtle = "2.6.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "process", "fs", "time", "sync", "net", "io-util"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["timeout", "limit", "trace", "sensitive-headers"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
uuid = { version = "1.29.3", features = ["v4"] }
zeroize = "1.9.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
