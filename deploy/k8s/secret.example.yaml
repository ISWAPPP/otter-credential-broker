# EXAMPLE ONLY - never commit real values. Create the real Secrets with e.g.:
#   otter-credential-broker keygen > kek
#   otter-credential-broker keygen > token-key
#   printf 'core %s\n' "$(otter-credential-broker gen-token)" > admin-tokens
#   printf 'postgres://broker:PASSWORD@db.example.internal:5432/broker?sslmode=verify-full\n' > database-url
#   kubectl -n credential-broker create secret generic credential-broker-kek \
#     --from-file=current=kek --from-file=token-key=token-key
#   kubectl -n credential-broker create secret generic credential-broker-admin --from-file=tokens=admin-tokens
#   kubectl -n credential-broker create secret generic credential-broker-database --from-file=url=database-url
# Then give the platform core its admin token (the line's second field), and
# delete the local files.
apiVersion: v1
kind: Secret
metadata:
  name: credential-broker-admin
  namespace: credential-broker
type: Opaque
stringData:
  tokens: |
    # <principal> <token (>= 32 chars)>; the principal is the audit actor
    core REPLACE_WITH_RANDOM_TOKEN_FROM_gen-token
